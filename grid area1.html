<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: 80px 400px 80px ;
        
        }
        .box{
            border: 2px solid black;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header{
            background-color: blue;
            grid-area: 1/1/1/5;
        }
        .left{
            background-color: red;
            grid-area:2/1/3/2 ;
        }
        .main{
            background-color: yellow;
            grid-area: 2/2/3/4;
        }
        .right{
            background-color: rgb(112, 204, 20);
            grid-area: 2/4/3/5;
        }
        .footer{
            background-color: blue;
            grid-area: 3/1/4/5;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class=" box header">Header</div>
    <div class=" box left">Left Sidebar</div>
    <div class=" box main">Main</div>
    <div class=" box right">right sidebar</div>
    <div class=" box footer">Footer</div>
    </div>
</body>
</html>
