<!DOCTYPE html>
<html>
<head>
    <title>CSS Flip Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    box-sizing: border-box;
}

body {
    /* background-color: #18181c; */
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 40px;
    color: black;
}

.container {
    width: 900px;
    margin: 50px auto;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

/* Common card */
.card {
    width: 150px;
    height: 200px;
    position: relative;
    perspective: 1000px;
}

.front,
.back {
    width: 100%;
    height: 100%;
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    backface-visibility: hidden;
    transition: 1s;
}

/* Card 1 */

.card1 .front {
    background-color: rgb(104, 92, 214);
}

.card1 .back {
    background-color: rgb(194, 80, 23);
    transform: rotateY(180deg);
}

.card1:hover .front {
    transform: rotateY(180deg);
}

.card1:hover .back {
    transform: rotateY(0deg);
}


/* Card 2 */

.card2 .front {
    background-color: rgb(27, 227, 24);
}

.card2 .back {
    background-color: rgb(27, 33, 3);
    transform: rotateY(180deg);
}

.card2:hover .front {
    transform: rotateY(180deg);
}

.card2:hover .back {
    transform: rotateY(0deg);
}


/* Card 3 */

.card3 .front {
    background-color: rgb(237, 24, 237);
}

.card3 .back {
    background-color: yellow;
    color: black;
    transform: rotateY(180deg);
}

.card3:hover .front {
    transform: rotateY(180deg);
}

.card3:hover .back {
    transform: rotateY(0deg);
}


/* Card 4 */

.card4 .front {
    background-color: brown;
}

.card4 .back {
    background-color: pink;
    color: black;
    transform: rotateY(180deg);
}

.card4:hover .front {
    transform: rotateY(180deg);
}

.card4:hover .back {
    transform: rotateY(0deg);
}
</style>
<body>

    <h1>Flip Cards</h1>

    <div class="container">
        <div class="card card1">
            <div class="front">Front</div>
            <div class="back">Back</div>
        </div>
        <div class="card card2">
            <div class="front">Front</div>
            <div class="back">Back</div>
        </div>
        <div class="card card3">
            <div class="front">Front</div>
            <div class="back">Back</div>
        </div>
        <div class="card card4">
            <div class="front">Front</div>
            <div class="back">Back</div>
        </div>

    </div>

</body>
</html>
