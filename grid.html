<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height:80vh;
            width:80vw;
            display:grid;
            grid-template-columns:repeat(4,250px);
            grid-template-rows: 50px 100px 100px 50px;
            gap:10px;
            box-sizing: border-box;
        }
        *{
            box-sizing: border-box;
        }
        .box1{
            
            background-color: rgb(6, 6, 85);
            color: white;
            grid-column: 1/7;
            height:50px;
            text-align: center;
            font-family: algerian;
            font-size: 25px;
        }
        .box2{
          
            background-color:rgb(18, 124, 165);
            color: white;
            grid-column: 1/3;
            border-radius: 10px;
            text-align: center;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:30px;
        }
        .box3{
           
            background-color: rgb(13, 232, 13);
            color:white;
            grid-column: 3/4;
            border-radius: 10px;
            text-align: center;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:30px;
        }
        .box4{
            background-color: rgb(126, 15, 230);
            color:white;
            grid-column: 1/2;
            height: 100px;
            text-align: center;
            border-radius: 10px;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:30px;
        }
        .box5{
            background-color: rgb(231, 153, 8);
            color: white;
            grid-column: 2/3;
            height: 100px;
            border-radius: 10px;
            text-align: center;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:30px;
        }
        .box6{
          
            background-color: rgb(90, 165, 90);
            color:white;
            grid-column: 3/4;
            height: 100px;
            border-radius: 10px;
            text-align: center;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:30px;
        }
        .box7{
         
            background-color: red;
            color:white;
            grid-column-start: 4;
            grid-column-end: 7;
            grid-row-start: 2;
            grid-row-end: 3;
            height:200px;
            text-align: center;
            padding-bottom: 50px;
            border-radius: 10px;
            font-family: lucidan hand writing;
            font-size: 20px;
            padding:80px;
        }
        .box8{
            
            background-color: rgb(2, 2, 37);
            color: white;
            text-align: center;
            font-family: algerian;
            font-size: 25px;
            grid-column: 1/7;
        }
        #one{
            box-sizing: border-box;
            border: 3px solid white;
            padding: 100px;
            height:80vh;
            width:90vw;
            background-color: antiquewhite;
            border-radius: 20px;
        }
    
    </style>
</head>
<body>
     <div id="one">
    <div class="parent">
    <div class="child box1">Headline</div>
    <div class="child box2">News 1</div>
    <div class="child box3">News 2</div>
    <div class="child box4">News 3</div>
    <div class="child box5">News 4</div>
    <div class="child box6">News 5</div>
    <div class="child box7">Advertisements</div>
    <div class="child box8">Footer</div>
    </div>
    </div>
</body>
</html>
