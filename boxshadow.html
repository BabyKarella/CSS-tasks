<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
         .parent{
            background-color: black;
            height:300px;
            width:300px;
            border: 4px solid black;
         }
         .child{
            height:150px;
            width:150px;
            border: 5px solid black;
            background-color:black;
            color:white;
            box-shadow: 5PX 15Px 10px 20px white ;
            text-align: center;
            line-height: 150px;
            border-radius: 50%;
            margin:20px;
            padding:20px;
              
         }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">Hero</div>
    </div>
</body>
</html>
